name: Deploy

# Deploys MarketingIQ to the cPanel shared-hosting account over SSH.
#
# Repository secrets (Settings -> Secrets and variables -> Actions -> Secrets):
#   SSH_HOST         server host name
#   SSH_USER         cPanel user name
#   SSH_PRIVATE_KEY  private key authorized in cPanel "SSH Access" (dedicated deploy key)
#   SSH_PORT         optional, default 22
#   SSH_KNOWN_HOSTS  optional but recommended: output of `ssh-keyscan -p PORT HOST`
#   SSH_KEY_PASSPHRASE optional: only if the private key has a passphrase
# Repository variables (same page -> Variables):
#   APP_ROOT   optional, default /home/<user>/marketingiq
#   APP_VENV   optional, path to the cPanel virtualenv bin/activate (auto-detected otherwise)
#   APP_URL    optional, e.g. https://marketingiq.barmageyat.net (enables health checks)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "test = read-only server check; deploy = update the live site"
        type: choice
        options: [test, deploy]
        default: test
      ref:
        description: "Branch to deploy"
        default: main
  push:
    # Pushing to this branch runs the read-only check before the workflow is on main.
    branches: [ops/deploy-pipeline]

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ !contains(github.event.head_commit.message, '[import-release]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'test' }}
      DEPLOY_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || 'main' }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      APP_ROOT: ${{ vars.APP_ROOT }}
      APP_VENV: ${{ vars.APP_VENV }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        run: |
          missing=""
          [ -n "$SSH_HOST" ] || missing="$missing SSH_HOST"
          [ -n "$SSH_USER" ] || missing="$missing SSH_USER"
          [ "${{ secrets.SSH_PRIVATE_KEY != '' }}" = "true" ] || missing="$missing SSH_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            as_vars=""
            [ "${{ vars.SSH_HOST != '' }}" = "true" ] && as_vars="$as_vars SSH_HOST"
            [ "${{ vars.SSH_USER != '' }}" = "true" ] && as_vars="$as_vars SSH_USER"
            [ "${{ vars.SSH_PRIVATE_KEY != '' }}" = "true" ] && as_vars="$as_vars SSH_PRIVATE_KEY"
            if [ -n "$as_vars" ]; then
              echo "::error title=Saved as variables::These were added as Variables, not Secrets:$as_vars. Delete them from Variables and add them under Secrets."
            fi
            echo "::error title=Missing secrets::Add these repository secrets:$missing"
            exit 1
          fi
          if [ "$MODE" = "deploy" ] && [ "${{ github.ref_name }}" != "main" ]; then
            echo "::error::Deploy mode must be started from the main branch workflow"
            exit 1
          fi

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
        run: bash scripts/deploy/setup_ssh.sh

      - name: Server check (read-only)
        run: |
          ssh server "APP_ROOT='${APP_ROOT}' APP_VENV='${APP_VENV}' bash -s" < scripts/deploy/remote_check.sh

      - name: Diagnose SSH failure
        if: failure()
        run: |
          port="${SSH_PORT:-22}"
          lines=()
          lines+=("Target port: $port")
          if timeout 10 bash -c "</dev/tcp/$SSH_HOST/$port" 2>/dev/null; then
            lines+=("TCP: port $port is reachable from GitHub")
          else
            lines+=("TCP: cannot reach port $port (wrong port, SSH disabled, or firewall/IP allow-list)")
          fi
          if [ -s ~/.ssh/known_hosts ]; then
            lines+=("Host key: obtained ($(awk '{print $2}' ~/.ssh/known_hosts | sort -u | tr '\n' ' '))")
          else
            lines+=("Host key: none received from server")
          fi
          head -n 1 ~/.ssh/deploy_key | grep -q -- "-----BEGIN" \
            && lines+=("Key format: $(head -n 1 ~/.ssh/deploy_key | tr -d '-' | xargs)") \
            || lines+=("Key format: first line is not a -----BEGIN ... KEY----- header")
          if ssh-keygen -y -P "" -f ~/.ssh/deploy_key >/dev/null 2>&1; then
            lines+=("Key: readable without passphrase")
          else
            lines+=("Key: cannot be read (passphrase-protected, PuTTY .ppk format, or pasted incompletely)")
          fi
          verbose=$(ssh -v -o ConnectTimeout=15 server true 2>&1 \
            | grep -E "Connecting to|Connection established|Remote protocol|Server host key|Authentications that can continue|Offering public key|Server accepts key|Permission denied|Authenticated|Connection (refused|timed out|closed)|Host key verification failed|No route|Could not resolve" \
            | sed -E 's/^debug1: //' | head -n 15)
          while IFS= read -r line; do lines+=("ssh: $line"); done <<< "$verbose"
          msg=$(printf '%s\n' "${lines[@]}" | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          echo "::warning title=SSH diagnosis::$msg"

      - name: Deploy
        if: env.MODE == 'deploy'
        run: |
          ssh server "APP_ROOT='${APP_ROOT}' APP_VENV='${APP_VENV}' DEPLOY_REF='${DEPLOY_REF}' bash -s" \
            < scripts/deploy/remote_deploy.sh

      - name: Health check
        if: env.APP_URL != ''
        run: |
          for path in /health/live /health/ready; do
            ok=""
            for attempt in 1 2 3 4 5 6; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${APP_URL%/}$path" || true)
              if [ "$code" = "200" ]; then ok=1; break; fi
              sleep 10
            done
            if [ -z "$ok" ]; then
              echo "::error title=Health check failed::$path returned $code"
              exit 1
            fi
            echo "::notice title=Health::$path OK"
          done

      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/deploy_key

  # One-time import of the release that exists only on the server into a new branch.
  # Triggered by a push to ops/deploy-pipeline whose commit message contains [import-release].
  import-release:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[import-release]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      APP_ROOT: ${{ vars.APP_ROOT }}
      IMPORT_BRANCH: import/release-3.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
        run: bash scripts/deploy/setup_ssh.sh

      - name: Package source on server (secret scan against live settings)
        run: ssh server "APP_ROOT='${APP_ROOT}' bash -s" < scripts/deploy/export_release.sh

      - name: Download package
        run: |
          ssh server 'cat ~/.marketingiq/export/release.tgz' > "$RUNNER_TEMP/release.tgz"
          ssh server 'rm -f ~/.marketingiq/export/release.tgz'
          mkdir -p "$RUNNER_TEMP/release"
          tar -xzf "$RUNNER_TEMP/release.tgz" -C "$RUNNER_TEMP/release"

      - name: Second secret scan
        run: python3 scripts/deploy/scan_secrets.py "$RUNNER_TEMP/release"

      - name: Commit onto main as a new branch
        run: |
          if git ls-remote --exit-code --heads origin "$IMPORT_BRANCH" >/dev/null; then
            echo "::error::Branch $IMPORT_BRANCH already exists; delete it first to re-import"
            exit 1
          fi
          git worktree add -q -b "$IMPORT_BRANCH" "$RUNNER_TEMP/import" origin/main
          cp -a "$RUNNER_TEMP/release/." "$RUNNER_TEMP/import/"
          cd "$RUNNER_TEMP/import"
          (cd "$RUNNER_TEMP/release" && find . -type f | sed 's#^\./##' | sort) > "$RUNNER_TEMP/server_files"
          git ls-files | grep -v '^\.github/' | sort > "$RUNNER_TEMP/main_files"
          only_main=$(comm -23 "$RUNNER_TEMP/main_files" "$RUNNER_TEMP/server_files" | tr '\n' ' ')
          git add -A
          added=$(git diff --cached --name-only --diff-filter=A | wc -l | tr -d ' ')
          modified=$(git diff --cached --name-only --diff-filter=M | wc -l | tr -d ' ')
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -F - <<MSG
          import: release 3.1 as deployed on the shared-hosting server

          Source copied from the live cPanel application folder, which contained
          work that was never pushed to GitHub (login throttling, company
          discovery policies, decision makers, web UI and more). Based on main
          so the diff shows exactly what the server adds.

          Excluded: caches, zips, logs, .htaccess, cPanel passenger_wsgi.py,
          env files and other server-only artifacts. Secret scans: live cPanel
          settings values (server side) and token patterns (runner side).

          Files in main but not on the server (kept unchanged): ${only_main:-none}

          Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01X6WP9SgYdrQG8bLD8Lt6ye
          MSG
          git push -q origin "$IMPORT_BRANCH"
          echo "::notice title=Imported::$IMPORT_BRANCH at $(git rev-parse --short HEAD): $added added, $modified modified. In main only: ${only_main:-none}"

      - name: Remove key
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
          ssh server 'rm -f ~/.marketingiq/export/release.tgz' 2>/dev/null || true
