name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop, "feature/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: marketingiq
          POSTGRES_PASSWORD: marketingiq_test
          POSTGRES_DB: marketingiq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketingiq -d marketingiq_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg://marketingiq:marketingiq_test@localhost:5432/marketingiq_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -c constraints/dev.txt -e '.[dev]'
      - run: ruff check .
      - run: python -m compileall -q src tests
      - run: pytest -q
      - name: Verify Alembic upgrade on PostgreSQL
        run: DATABASE_URL="$TEST_DATABASE_URL" alembic upgrade head
