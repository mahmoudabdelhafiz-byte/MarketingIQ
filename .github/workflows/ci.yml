name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main, "feature/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: marketingiq_test
          MYSQL_USER: marketingiq
          MYSQL_PASSWORD: marketingiq_test
          MYSQL_ROOT_PASSWORD: marketingiq_root_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -umarketingiq -pmarketingiq_test --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: mysql+pymysql://marketingiq:marketingiq_test@127.0.0.1:3306/marketingiq_test?charset=utf8mb4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -c constraints/dev.txt -e '.[dev]'
      - run: ruff check .
      - run: python -m compileall -q src tests
      - run: pytest -q
      - name: Verify frozen Alembic baseline on MySQL
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          alembic upgrade 20260914_01
          python - <<'PY'
          import os

          from sqlalchemy import create_engine, inspect

          expected = {
              "alembic_version",
              "audit_logs",
              "companies",
              "company_facts",
              "company_identifiers",
              "data_sources",
              "evidence",
              "human_overrides",
              "icp_criteria",
              "icps",
              "organization_companies",
              "organization_memberships",
              "organizations",
              "product_criteria",
              "products",
              "research_runs",
              "users",
          }
          engine = create_engine(os.environ["DATABASE_URL"])
          actual = set(inspect(engine).get_table_names())
          missing = sorted(expected - actual)
          unexpected = sorted(actual - expected)
          if missing or unexpected:
              raise SystemExit(
                  f"revision 20260914_01 drifted: missing={missing}, unexpected={unexpected}"
              )
          PY
      - name: Verify Alembic upgrade to head on MySQL
        run: DATABASE_URL="$TEST_DATABASE_URL" alembic upgrade head
      - name: Verify database schema readiness
        run: DATABASE_URL="$TEST_DATABASE_URL" python -m marketingiq.jobs.verify_database_schema
