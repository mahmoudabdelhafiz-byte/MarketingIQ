name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main, "feature/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: marketingiq_test
          MYSQL_USER: marketingiq
          MYSQL_PASSWORD: marketingiq_test
          MYSQL_ROOT_PASSWORD: marketingiq_root_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -umarketingiq -pmarketingiq_test --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: mysql+pymysql://marketingiq:marketingiq_test@127.0.0.1:3306/marketingiq_test?charset=utf8mb4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -c constraints/dev.txt -e '.[dev]'
      - run: ruff check .
      - run: python -m compileall -q src tests
      - run: pytest -q
      - name: Verify frozen Alembic baseline on MySQL
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          alembic upgrade 20260914_01
          python - <<'PY'
          import os

          from sqlalchemy import create_engine, inspect

          expected = {
              "alembic_version",
              "audit_logs",
              "companies",
              "company_facts",
              "company_identifiers",
              "data_sources",
              "evidence",
              "human_overrides",
              "icp_criteria",
              "icps",
              "organization_companies",
              "organization_memberships",
              "organizations",
              "product_criteria",
              "products",
              "research_runs",
              "users",
          }
          engine = create_engine(os.environ["DATABASE_URL"])
          actual = set(inspect(engine).get_table_names())
          missing = sorted(expected - actual)
          unexpected = sorted(actual - expected)
          if missing or unexpected:
              raise SystemExit(
                  f"revision 20260914_01 drifted: missing={missing}, unexpected={unexpected}"
              )
          PY
      - name: Verify Alembic upgrade to head on MySQL
        run: DATABASE_URL="$TEST_DATABASE_URL" alembic upgrade head
      - name: Verify database schema readiness
        run: DATABASE_URL="$TEST_DATABASE_URL" python -m marketingiq.jobs.verify_database_schema

  mariadb:
    # Production runs MariaDB 11.4 on the shared host; prove migrations and DB tests there too.
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: marketingiq_test
          MARIADB_USER: marketingiq
          MARIADB_PASSWORD: marketingiq_test
          MARIADB_ROOT_PASSWORD: marketingiq_root_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: mysql+pymysql://marketingiq:marketingiq_test@127.0.0.1:3306/marketingiq_test?charset=utf8mb4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -c constraints/dev.txt -e '.[dev]'
      - name: Database-backed tests on MariaDB
        run: pytest -q -m mysql
      - name: Start from a latin1 database, like the production cPanel database
        run: |
          python - <<'PY'
          import pymysql
          c = pymysql.connect(host="127.0.0.1", user="root", password="marketingiq_root_test")
          with c.cursor() as cur:
              cur.execute("DROP DATABASE IF EXISTS marketingiq_test")
              cur.execute("CREATE DATABASE marketingiq_test CHARACTER SET latin1 COLLATE latin1_swedish_ci")
              cur.execute("GRANT ALL ON marketingiq_test.* TO 'marketingiq'@'%'")
          c.commit()
          PY
      - name: Alembic upgrade to head on MariaDB
        run: DATABASE_URL="$TEST_DATABASE_URL" alembic upgrade head
      - name: Every table stores Arabic (utf8mb4)
        run: |
          python - <<'PY'
          import pymysql
          c = pymysql.connect(host="127.0.0.1", user="marketingiq", password="marketingiq_test",
                              database="marketingiq_test", charset="utf8mb4")
          with c.cursor() as cur:
              cur.execute(
                  "SELECT table_name, table_collation FROM information_schema.tables "
                  "WHERE table_schema = DATABASE() AND table_collation NOT LIKE 'utf8mb4%'"
              )
              bad = cur.fetchall()
              assert not bad, f"Tables not utf8mb4: {bad}"
              cur.execute("CREATE TEMPORARY TABLE t (v VARCHAR(50))")
              cur.execute("INSERT INTO t VALUES (%s)", ("مرحباً CardIQ",))
              cur.execute("SELECT v FROM t")
              value = cur.fetchone()[0]
              assert value == "مرحباً CardIQ", value
          print("utf8mb4 OK")
          PY
      - name: Database schema readiness on MariaDB
        run: DATABASE_URL="$TEST_DATABASE_URL" python -m marketingiq.jobs.verify_database_schema
      - name: Alembic downgrade and re-upgrade of the latest revision
        run: |
          DATABASE_URL="$TEST_DATABASE_URL" alembic downgrade -1
          DATABASE_URL="$TEST_DATABASE_URL" alembic upgrade head
