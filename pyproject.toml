[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marketingiq"
version = "0.1.0"
description = "Multi-tenant B2B marketing intelligence foundation"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pwdlib[argon2]>=0.2,<1",
  "pymysql>=1.1,<2",
  "pyjwt>=2.9,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/marketingiq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["mysql: requires TEST_DATABASE_URL pointing to a disposable MySQL database"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/marketingiq/api/app.py" = ["B008"]
