[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marketingiq"
version = "0.1.0"
description = "Multi-tenant B2B marketing intelligence foundation"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/marketingiq"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
